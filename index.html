<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Service Recovery Points</title>
<style>
  :root{--bg:#0e1626;--card:#16213a;--in:#1c2946;--line:#2a3a5e;--text:#e8ecf5;--muted:#8e9ab5;--gold:#c9a55a;--gold2:#e3c98a;--ok:#4fbf8a;--bad:#e06464}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--text);font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;padding:16px}
  .card{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
  h1{margin:0 0 18px;font-size:18px;text-align:center}
  h1 span{color:var(--gold)}
  label{display:block;font-size:12px;color:var(--muted);margin:12px 0 4px}
  input,select{width:100%;background:var(--in);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:11px;font-size:16px}
  input:focus,select:focus{outline:none;border-color:var(--gold)}
  .out{margin-top:22px;padding-top:18px;border-top:1px solid var(--line);text-align:center}
  .muted{color:var(--muted);font-size:13px}
  .big{font-size:48px;font-weight:700;color:var(--gold2);margin:6px 0 2px}
  .cost{font-size:14px;color:var(--muted)}
  button{width:100%;margin-top:18px;background:var(--gold);color:#1a1a1a;border:0;border-radius:8px;padding:13px;font-size:15px;font-weight:700;cursor:pointer}
  button:disabled{opacity:.5;cursor:default}
  #msg{margin-top:10px;text-align:center;font-size:13px;min-height:18px}
</style>
</head>
<body>
<div class="card">
  <h1>Service Recovery <span>Points</span></h1>

  <label>Confirmation #</label>
  <input id="conf" autocomplete="off">

  <label>Bonvoy tier</label>
  <select id="tier">
    <option value="10">Member</option>
    <option value="11">Silver Elite</option>
    <option value="12.5">Gold Elite</option>
    <option value="15">Platinum Elite</option>
    <option value="17.5">Titanium Elite</option>
    <option value="17.5">Ambassador Elite</option>
  </select>

  <label>Total room rate ($, before tax)</label>
  <input id="rate" type="number" min="0" step="0.01" placeholder="0.00" inputmode="decimal">

  <div class="out">
    <div class="muted">Guest earns <b id="earn">0</b> pts — give the same</div>
    <div class="big" id="pts">0</div>
    <div class="cost">Cost to hotel: <b id="cost">$0.00</b></div>
  </div>

  <button id="save">Save to Log</button>
  <div id="msg"></div>
</div>

<script>
// Paste the Apps Script web app URL here after deploying:
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwLkfpwazbEBpchjlLCEbIiopRSfh-fci8sd2MExou_cz0mitRmbl3f2zO1Ry0RDgebWQ/exec";
const COST_PER_POINT = 0.0055;

const $ = id => document.getElementById(id);
let pts = 0;

function calc(){
  pts = Math.round((parseFloat($("rate").value)||0) * parseFloat($("tier").value));
  const f = n => n.toLocaleString("en-US");
  $("earn").textContent = f(pts);
  $("pts").textContent = f(pts);
  $("cost").textContent = "$" + (pts*COST_PER_POINT).toFixed(2);
}
$("tier").oninput = calc; $("rate").oninput = calc;

function msg(t, ok){ $("msg").textContent = t; $("msg").style.color = ok ? "var(--ok)" : "var(--bad)"; }

$("save").onclick = async () => {
  const conf = $("conf").value.trim();
  if(!conf) return msg("Enter the confirmation number.");
  if(!pts)  return msg("Enter the room rate.");
  $("save").disabled = true; msg("Saving…", true);
  const data = {
    conf,
    tier: $("tier").selectedOptions[0].text,
    rate: parseFloat($("rate").value),
    points: pts,
    cost: +(pts*COST_PER_POINT).toFixed(2)
  };
  try{
    await fetch(SCRIPT_URL, {method:"POST", mode:"no-cors", headers:{"Content-Type":"text/plain"}, body:JSON.stringify(data)});
    msg("Saved to log ✓", true);
    $("conf").value = ""; $("rate").value = ""; $("tier").selectedIndex = 0; calc();
  }catch(e){
    msg("Could not save — check connection.");
  }
  $("save").disabled = false;
};
</script>
</body>
</html>
