<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Joyce — 6:00 PM in, 11:00 PM out</title>
<style>
  :root{
    --navy-deep:#07131F;
    --navy:#0C1E30;
    --gold:#C9A227;
    --gold-soft:#E4C56A;
    --moon:#7FA8C9;
    --moon-soft:#A8C6DD;
    --ink:#EAF0F6;
    --muted:#6C8399;
    --accent:var(--gold);
    --accent-soft:var(--gold-soft);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:radial-gradient(120% 90% at 50% 0%, var(--navy) 0%, var(--navy-deep) 70%);
    color:var(--ink);
    font-family:"Avenir Next","Segoe UI",Inter,system-ui,-apple-system,sans-serif;
    display:flex;align-items:center;justify-content:center;
    padding:32px;
    transition:background .6s ease;
  }
  body.night{--accent:var(--moon);--accent-soft:var(--moon-soft);--navy:#0A1826}
  main{width:100%;max-width:960px;text-align:center}

  .portrait{
    width:clamp(110px,22vw,168px);
    height:clamp(110px,22vw,168px);
    margin:0 auto 24px;
    border-radius:50%;
    overflow:hidden;
    border:2px solid var(--accent);
    box-shadow:0 0 0 8px rgba(201,162,39,.07), 0 18px 44px rgba(0,0,0,.45);
    transition:filter .6s ease, box-shadow .6s ease, border-color .6s ease;
  }
  body.night .portrait{box-shadow:0 0 0 8px rgba(127,168,201,.07), 0 18px 44px rgba(0,0,0,.45)}
  .portrait img{width:100%;height:100%;object-fit:cover;display:block}
  /* dimmed while she's away, full colour while she's on the desk */
  body.away .portrait{filter:saturate(.35) brightness(.72)}

  .lede{
    font-size:clamp(1rem,3.2vw,1.55rem);
    font-weight:400;
    color:var(--muted);
    margin-bottom:28px;
  }
  .lede strong{color:var(--accent-soft);font-weight:600}

  .clockface{
    display:flex;align-items:flex-end;justify-content:center;
    gap:clamp(4px,1.2vw,14px);
    font-variant-numeric:tabular-nums;
    font-feature-settings:"tnum" 1;
    font-family:"SF Mono",ui-monospace,"JetBrains Mono",Menlo,Consolas,monospace;
    line-height:.9;
  }
  .unit{display:flex;flex-direction:column;align-items:center;gap:12px}
  .digits{
    font-size:clamp(3.2rem,15vw,9rem);
    font-weight:600;
    color:var(--ink);
    text-shadow:0 0 60px rgba(201,162,39,.18);
  }
  body.night .digits{text-shadow:0 0 60px rgba(127,168,201,.18)}
  .name{
    font-family:"Avenir Next","Segoe UI",Inter,system-ui,sans-serif;
    font-size:clamp(.62rem,1.6vw,.8rem);
    letter-spacing:.22em;
    color:var(--muted);
  }
  .sep{
    font-size:clamp(2.4rem,11vw,6.5rem);
    color:rgba(108,131,153,.45);
    padding-bottom:calc(12px + clamp(.62rem,1.6vw,.8rem));
  }
  .fraction .digits{
    font-size:clamp(1.8rem,7vw,4.2rem);
    color:var(--accent);
    padding-bottom:.35em;
  }
  .fraction .name{color:var(--muted)}

  .rule{
    width:min(420px,80%);
    height:1px;
    background:linear-gradient(90deg,transparent,var(--accent),transparent);
    opacity:.45;
    margin:44px auto 20px;
  }
  .footline{
    font-size:.9rem;
    color:var(--muted);
    font-variant-numeric:tabular-nums;
  }
  .footline span{color:rgba(108,131,153,.55)}

  body.milestone .clockface{display:none}
  .milestone-msg{display:none}
  body.milestone .milestone-msg{display:block}
  .milestone-msg h1{
    font-size:clamp(2rem,8vw,4.5rem);
    font-weight:600;
    color:var(--accent-soft);
    letter-spacing:-.01em;
  }
  .milestone-msg p{margin-top:16px;color:var(--muted)}

  @media (prefers-reduced-motion:no-preference){
    body.milestone .milestone-msg h1{animation:rise .8s ease-out}
    @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  }
</style>
</head>

  <p class="lede" id="lede"></p>

  <div class="clockface" id="clock">
    <div class="unit"><span class="digits" id="hh">00</span><span class="name">hours</span></div>
    <span class="sep">:</span>
    <div class="unit"><span class="digits" id="mm">00</span><span class="name">minutes</span></div>
    <span class="sep">:</span>
    <div class="unit"><span class="digits" id="ss">00</span><span class="name">seconds</span></div>
    <div class="unit fraction"><span class="digits" id="cs">.00</span><span class="name">split</span></div>
  </div>

  <div class="milestone-msg">
    <h1 id="msgTitle"></h1>
    <p id="msgSub"></p>
  </div>

  <div class="rule"></div>
  <p class="footline"><span id="nextUp"></span> &nbsp;·&nbsp; <span id="now"></span></p>
</main>

<script>
(function () {
  const el = {
    hh: document.getElementById('hh'),
    mm: document.getElementById('mm'),
    ss: document.getElementById('ss'),
    cs: document.getElementById('cs'),
    lede: document.getElementById('lede'),
    msgTitle: document.getElementById('msgTitle'),
    msgSub: document.getElementById('msgSub'),
    nextUp: document.getElementById('nextUp'),
    now: document.getElementById('now')
  };
  const pad = (n) => String(n).padStart(2, '0');
  const GRACE_MS = 10 * 60 * 1000;   // how long each milestone message stays up

  function at(base, hour) {
    const d = new Date(base);
    d.setHours(hour, 0, 0, 0);
    return d;
  }

  function phase(now) {
    const shiftStart = at(now, 18);
    const shiftEnd = at(now, 23);

    if (now < shiftStart) {
      return { mode: 'count', target: shiftStart, night: false, onDesk: false,
        lede: '<strong>Joyce</strong> is coming to the front desk at 6:00 PM',
        next: 'Then home at 11:00 PM' };
    }
    if (now - shiftStart < GRACE_MS) {
      return { mode: 'msg', night: false, onDesk: true,
        title: 'Joyce is at the front desk.', sub: 'Right on time, 6:00 PM.',
        next: 'Home at 11:00 PM' };
    }
    if (now < shiftEnd) {
      return { mode: 'count', target: shiftEnd, night: true, onDesk: true,
        lede: '<strong>Joyce</strong> goes home at 11:00 PM',
        next: 'On the desk since 6:00 PM' };
    }
    if (now - shiftEnd < GRACE_MS) {
      return { mode: 'msg', night: true, onDesk: false,
        title: 'Joyce is off the clock.', sub: 'Home time. Good night.',
        next: 'Back tomorrow at 6:00 PM' };
    }
    // after 11:10 PM — count to tomorrow's 6 PM
    const tomorrow = at(now, 18);
    tomorrow.setDate(tomorrow.getDate() + 1);
    return { mode: 'count', target: tomorrow, night: true, onDesk: false,
      lede: '<strong>Joyce</strong> is back at the front desk at 6:00 PM',
      next: 'Then home at 11:00 PM' };
  }

  function frame() {
    const now = new Date();
    const p = phase(now);

    document.body.classList.toggle('night', p.night);
    document.body.classList.toggle('milestone', p.mode === 'msg');
    document.body.classList.toggle('away', !p.onDesk);
    el.nextUp.textContent = p.next;

    if (p.mode === 'msg') {
      el.msgTitle.textContent = p.title;
      el.msgSub.textContent = p.sub;
      document.title = p.title;
    } else {
      el.lede.innerHTML = p.lede;
      const diff = p.target - now;
      const h = Math.floor(diff / 3600000);
      const m = Math.floor(diff / 60000) % 60;
      const s = Math.floor(diff / 1000) % 60;
      const c = Math.floor(diff / 10) % 100;
      el.hh.textContent = pad(h);
      el.mm.textContent = pad(m);
      el.ss.textContent = pad(s);
      el.cs.textContent = '.' + pad(c);
      document.title = pad(h) + ':' + pad(m) + ':' + pad(s) + ' — Joyce';
    }

    el.now.textContent = now.toLocaleTimeString([], {
      hour: 'numeric', minute: '2-digit', second: '2-digit'
    });

    requestAnimationFrame(frame);
  }

  frame();
})();
</script>
